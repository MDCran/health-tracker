<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Health Tracker architecture</title>
  <desc id="desc">A Next.js frontend communicates with a Spring Boot API, which persists data in PostgreSQL and files in S3 through LocalStack during development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Health Tracker</text>
  <text x="70" y="112" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="17">Personal health data, securely organized</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="70" y="190" width="235" height="170" rx="18" fill="#0ea5e9"/>
    <text x="100" y="242" fill="white" font-size="23" font-weight="700">Web app</text>
    <text x="100" y="276" fill="#e0f2fe" font-size="17">Next.js frontend</text>
    <text x="100" y="310" fill="#e0f2fe" font-size="15">localhost:3000</text>
    <rect x="480" y="190" width="240" height="170" rx="18" fill="#6366f1"/>
    <text x="510" y="242" fill="white" font-size="23" font-weight="700">API</text>
    <text x="510" y="276" fill="#e0e7ff" font-size="17">Spring Boot</text>
    <text x="510" y="310" fill="#e0e7ff" font-size="15">localhost:9147</text>
    <rect x="895" y="130" width="235" height="125" rx="18" fill="#14b8a6"/>
    <text x="925" y="182" fill="white" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="925" y="216" fill="#ccfbf1" font-size="15">Structured health records</text>
    <rect x="895" y="295" width="235" height="125" rx="18" fill="#f59e0b"/>
    <text x="925" y="347" fill="white" font-size="21" font-weight="700">S3 storage</text>
    <text x="925" y="381" fill="#fef3c7" font-size="15">LocalStack in development</text>
  </g>
  <path d="M305 275H480" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M720 240 895 192" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M720 310 895 355" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="383" y="255" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="14">JSON / REST</text>
  <text x="770" y="202" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="14">JDBC</text>
  <text x="772" y="344" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="14">S3 API</text>
</svg>
